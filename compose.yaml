services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: veris
      POSTGRES_USER: veris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veris-local-only}
    ports:
      - "5432:5432"
    volumes:
      - veris-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veris -d veris"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  veris-postgres:

