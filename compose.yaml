services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: thesos
      POSTGRES_USER: thesos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thesos-local-only}
    ports:
      - "5432:5432"
    volumes:
      - thesos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesos -d thesos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thesos-postgres:
